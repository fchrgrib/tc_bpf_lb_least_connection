# Least-privilege LB agents. Only the datapath needs node-level access:
#   - tracker   : writes the pinned service_pod_ips map        (BPF, SYS_RESOURCE)
#   - tc-loader : attaches the TC program to the host iface   (BPF, NET_ADMIN, SYS_RESOURCE)
# Neither needs privileged, hostPID, nor SYS_ADMIN.
# Images are digest-pinned by build-and-install.sh after push.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pod-ip-tracker
  labels:
    app: pod-ip-tracker
spec:
  selector:
    matchLabels:
      app: pod-ip-tracker
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: pod-ip-tracker
    spec:
      # Run on every node (tolerate all taints). Add a nodeAffinity here if you
      # want to exclude control-plane nodes.
      tolerations:
      - operator: Exists
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      serviceAccountName: pod-ip-tracker
      # Needed: the datapath operates on the host interface / host routes.
      hostNetwork: true
      # NOT needed anymore (was over-privileged): hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
      # Ensure bpffs is mounted before tracker / tc-loader start.
      - name: mount-bpf-fs
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          if ! mountpoint -q /sys/fs/bpf; then
            mount -t bpf bpf /sys/fs/bpf || echo "bpffs mount failed, continuing";
          fi
          mkdir -p /sys/fs/bpf
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["SYS_ADMIN"]   # mount(2) requires it
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: bpf-fs
          mountPath: /sys/fs/bpf
      containers:
      # 1) Watches Pods/Services, maintains /sys/fs/bpf/service_pod_ips.
      - name: tracker
        image: fchrgrib/pod-ip-tracker:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            # BPF: create/pin maps. SYS_RESOURCE: memlock accounting.
            # On kernels < 5.8 (no CAP_BPF) add SYS_ADMIN here.
            add: ["BPF", "SYS_RESOURCE"]
          # RuntimeDefault would BLOCK the bpf() syscall: the default
          # Docker/containerd seccomp profile only allows bpf/perf_event_open
          # when the process holds CAP_SYS_ADMIN. We deliberately don't grant
          # SYS_ADMIN, so seccomp is unconfined and the capability set above is
          # the actual security boundary.
          seccompProfile:
            type: Unconfined
        env:
        - name: USE_INCLUSTER_CONFIG
          value: "true"
        - name: LB_SERVICE_NAME
          value: "test-service"
        - name: LB_NAMESPACE
          value: "default"
        volumeMounts:
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: bpf-fs
          mountPath: /sys/fs/bpf
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      # 2) Attaches the TC eBPF program to the host iface.
      - name: tc-loader
        image: fchrgrib/tc-lb-loader:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            # BPF: load program. NET_ADMIN: attach TC + conntrack. SYS_RESOURCE: memlock.
            # On kernels < 5.8 (no CAP_BPF) add SYS_ADMIN here.
            add: ["BPF", "NET_ADMIN", "SYS_RESOURCE"]
          # Unconfined, not RuntimeDefault: the default profile gates bpf()
          # behind CAP_SYS_ADMIN, which we intentionally do not grant.
          seccompProfile:
            type: Unconfined
        env:
        - name: LB_IFACE
          value: ""
        - name: LB_NODEPORT
          value: "30080"
        - name: LB_TARGET_PORT
          value: "8000"
        - name: LB_BE1
          value: "auto"
        - name: LB_BE2
          value: "auto"
        volumeMounts:
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: bpf-fs
          mountPath: /sys/fs/bpf
        - name: tmp
          mountPath: /tmp
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - |
                IFACE="${LB_IFACE:-}";
                if [ -z "$IFACE" ]; then
                  IFACE=$(ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1)}' | head -n1);
                fi;
                if [ -n "$IFACE" ]; then tc qdisc del dev "$IFACE" clsact 2>/dev/null || true; fi;
                sleep 5;
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: lib-modules
        hostPath:
          path: /lib/modules
      - name: bpf-fs
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: tmp
        emptyDir: {}
